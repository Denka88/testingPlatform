<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Платформа тестирования{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    {% block extra_css %}{% endblock %}
</head>
<body class="auth-page">
    <button class="theme-toggle-floating" id="themeToggle" aria-label="Переключить тему">
        <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
    </button>
    
    <div class="auth-wrapper">
        {% block content %}{% endblock %}
    </div>

    <div class="notification-center" id="notificationCenter" aria-live="polite" aria-atomic="true"></div>

    <div class="global-confirm-overlay" id="globalConfirmOverlay" hidden>
        <div class="global-confirm-modal" role="dialog" aria-modal="true" aria-labelledby="globalConfirmTitle">
            <h2 class="global-confirm-title" id="globalConfirmTitle">Подтверждение</h2>
            <p class="global-confirm-text" id="globalConfirmText">Вы уверены?</p>
            <div class="global-confirm-actions">
                <button type="button" class="btn btn-secondary" id="globalConfirmCancel">Отмена</button>
                <button type="button" class="btn btn-danger" id="globalConfirmAccept">Подтвердить</button>
            </div>
        </div>
    </div>
    
    <script src="{% static 'js/main.js' %}"></script>
    {% if messages %}
    <script>
        (function() {
            function renderServerNotifications() {
                {% for message in messages %}
                    showNotification('{{ message|escapejs }}', '{{ message.tags|default:"info"|escapejs }}');
                {% endfor %}
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', renderServerNotifications, { once: true });
            } else {
                renderServerNotifications();
            }
        })();
    </script>
    {% endif %}
    {% block extra_js %}{% endblock %}
</body>
</html>
